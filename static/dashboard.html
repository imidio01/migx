<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MigX Bot - Pro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... (mantém o CSS da resposta anterior) ... */
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); color: var(--text-main); min-height: 100vh; padding: 1rem; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        h1 i { color: var(--primary); }
        .btn-logout { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.6rem 1.2rem; border-radius: 50px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.4); }
        .tabs { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1.5rem; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); padding: 0.8rem 1.5rem; border-radius: 50px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: 0.3s; display: flex; align-items: center; gap: 0.5rem; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .card { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .card .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .card .value { font-size: 1.8rem; font-weight: 700; }
        .card .value.small { font-size: 1.1rem; word-break: break-all; }
        .status-indicator { display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem; font-weight: 600; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.on { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot.off { background: var(--danger); }
        .panel { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .panel h2 { font-size: 1.2rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .form-control { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); color: white; padding: 0.8rem 1rem; border-radius: 10px; font-size: 1rem; transition: 0.3s; }
        .form-control:focus { outline: none; border-color: var(--primary); background: rgba(15, 23, 42, 0.9); }
        .row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .col { flex: 1; min-width: 140px; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 1rem; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: rgba(148, 163, 184, 0.2); color: var(--text-main); border: 1px solid var(--glass-border); padding: 0.6rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-secondary:hover { background: rgba(148, 163, 184, 0.3); }
        .room-trigger { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .room-trigger i { color: var(--text-muted); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #1e293b; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 1.5rem; animation: slideUp 0.3s ease; max-height: 85vh; display: flex; flex-direction: column; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @media (min-width: 600px) { .modal-overlay { align-items: center; } .modal-content { border-radius: 20px; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .room-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 0.5rem; padding-right: 0.5rem; margin-bottom: 1rem; }
        .room-item { padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border: 1px solid transparent; }
        .room-item:hover { background: rgba(255,255,255,0.1); }
        .room-item.selected { border: 1px solid var(--primary); background: rgba(59, 130, 246, 0.1); }
        .room-item.selected::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: var(--primary); }
        .selected-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .chip { background: rgba(59, 130, 246, 0.2); color: #93c5fd; padding: 0.3rem 0.8rem; border-radius: 50px; font-size: 0.8rem; display: flex; align-items: center; gap: 0.3rem; border: 1px solid rgba(59, 130, 246, 0.4); }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--text-muted); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; }
        .badge { padding: 0.3rem 0.8rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
        .badge.running { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.finished { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }
        .badge.stopped { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .btn-stop { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
        .btn-stop:hover { background: rgba(239, 68, 68, 0.4); }
        .log-box { background: #000; border-radius: 12px; padding: 1rem; font-family: 'Consolas', monospace; font-size: 0.85rem; height: 300px; overflow-y: auto; border: 1px solid var(--glass-border); }
        .log-line { margin-bottom: 0.3rem; line-height: 1.4; word-break: break-all; }
        .log-line .time { color: #64748b; margin-right: 0.5rem; }
        .log-line.info { color: #e2e8f0; }
        .log-line.ok { color: var(--success); }
        .log-line.warn { color: #fbbf24; }
        .log-line.err { color: var(--danger); }

        /* BOTS LIST */
        .bot-row { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 0.5rem; }
        .bot-info { display: flex; flex-direction: column; gap: 0.2rem; }
        .bot-name { font-weight: 600; }
        .bot-status { font-size: 0.8rem; color: var(--text-muted); }
        .checkbox-group { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
        .checkbox-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: rgba(255,255,255,0.03); border-radius: 8px; cursor: pointer; }
        .checkbox-item:hover { background: rgba(255,255,255,0.08); }
        .checkbox-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-robot"></i> MigX Pro</h1>
            <button class="btn-logout" id="logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="overview"><i class="fa-solid fa-chart-pie"></i> Overview</button>
            <button class="tab" data-tab="my-bots"><i class="fa-solid fa-users-gear"></i> My Bots</button>
            <button class="tab" data-tab="tasks"><i class="fa-solid fa-list-check"></i> Tasks</button>
            <button class="tab" data-tab="new"><i class="fa-solid fa-plus"></i> New Task</button>
            <button class="tab" data-tab="admin" id="admin-tab" style="display:none;"><i class="fa-solid fa-shield-halved"></i> Admin</button>
        </div>

        <!-- OVERVIEW -->
        <div class="tab-content active" id="tab-overview">
            <div class="grid" id="bots-overview"></div>
        </div>

        <!-- MY BOTS -->
        <div class="tab-content" id="tab-my-bots">
            <div class="panel">
                <h2><i class="fa-solid fa-plus"></i> Add a Bot</h2>
                <div class="row">
                    <div class="col"><input type="text" id="new-bot-user" class="form-control" placeholder="Username"></div>
                    <div class="col"><input type="password" id="new-bot-pass" class="form-control" placeholder="Password"></div>
                    <div class="col" style="flex:0 0 auto;"><button class="btn-primary" id="btn-add-bot" style="width:auto; padding:0.8rem 1.5rem;">Add</button></div>
                </div>
                <div id="bot-msg" style="margin-top:0.8rem; font-size:0.9rem;"></div>
            </div>

            <div class="panel">
                <h2><i class="fa-solid fa-users"></i> My Bots</h2>
                <div id="bots-list"></div>
            </div>
        </div>

        <!-- TASKS -->
        <div class="tab-content" id="tab-tasks">
            <div class="panel">
                <h2><i class="fa-solid fa-list-check"></i> All Tasks</h2>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Bot</th><th>Action</th><th>Room</th><th>Progress</th><th>Status</th><th></th></tr></thead>
                        <tbody id="tasks-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- NEW TASK -->
        <div class="tab-content" id="tab-new">
            <div class="panel">
                <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Create Task</h2>

                <div class="form-group">
                    <label>Which bots should run this?</label>
                    <div class="checkbox-group" id="bot-checkboxes"></div>
                </div>

                <div class="form-group">
                    <label>Action</label>
                    <select id="action-select" class="form-control">
                        <option value="park">Park (Stay Idle)</option>
                        <option value="gift">Send Gifts</option>
                        <option value="royale">Play Royale Battle</option>
                        <option value="cricket">Play Cricket</option>
                        <option value="dice">Play Dice</option>
                        <option value="lowcard">Play Lowcard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Target Rooms (Select multiple for Park)</label>
                    <div class="form-control room-trigger" id="room-trigger">
                        <span id="selected-room-name" style="color:var(--text-muted)">Select room(s)...</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="selected-chips" id="selected-chips"></div>
                </div>

                <div id="gift-fields" style="display:none;">
                    <div class="form-group">
                        <label>Gift Name</label>
                        <input type="text" id="gift-key" class="form-control" list="gift-list" placeholder="e.g. Fly">
                        <datalist id="gift-list"></datalist>
                    </div>
                    <div class="row">
                        <div class="col"><div class="form-group"><label>Quantity</label><input type="number" id="gift-count" class="form-control" value="10"></div></div>
                        <div class="col"><div class="form-group"><label>Interval (s)</label><input type="number" id="gift-interval" class="form-control" value="1" min="1"></div></div>
                    </div>
                </div>

                <div id="park-fields" style="display:none;">
                    <div class="form-group">
                        <label>Duration (mins, 0 = infinite)</label>
                        <input type="number" id="park-duration" class="form-control" value="0">
                    </div>
                </div>

                <div id="game-fields" style="display:none;">
                    <div class="row">
                        <div class="col"><div class="form-group"><label>Min Bet</label><input type="number" id="bet-min" class="form-control" value="10"></div></div>
                        <div class="col"><div class="form-group"><label>Max Bet</label><input type="number" id="bet-max" class="form-control" value="100"></div></div>
                    </div>
                    <div class="row">
                        <div class="col"><div class="form-group"><label>Num Bets</label><input type="number" id="bet-count" class="form-control" value="2"></div></div>
                        <div class="col"><div class="form-group"><label>Play Time (mins, 0=inf)</label><input type="number" id="play-duration" class="form-control" value="0"></div></div>
                    </div>
                </div>

                <button class="btn-primary" id="btn-create" style="margin-top:1rem;">
                    <i class="fa-solid fa-rocket"></i> Launch Task on Selected Bots
                </button>
                <div id="msg" style="margin-top:1rem; text-align:center; font-size:0.9rem;"></div>
            </div>
        </div>

        <!-- ADMIN -->
        <div class="tab-content" id="tab-admin">
            <div class="panel">
                <h2><i class="fa-solid fa-users"></i> All Active Bots</h2>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Bot</th><th>Room</th><th>Task</th><th>Status</th></tr></thead>
                        <tbody id="admin-bots-body"></tbody>
                    </table>
                </div>
            </div>
            <div class="panel">
                <h2><i class="fa-solid fa-door-open"></i> Manage Rooms</h2>
                <div class="table-responsive" style="margin-bottom:1rem;">
                    <table><tbody id="admin-rooms-body"></tbody></table>
                </div>
                <div class="row">
                    <div class="col"><input type="text" id="new-room-id" class="form-control" placeholder="Room ID"></div>
                    <div class="col"><input type="text" id="new-room-name" class="form-control" placeholder="Room Name"></div>
                    <div class="col"><input type="text" id="new-room-actions" class="form-control" placeholder="park,gift"></div>
                </div>
                <button class="btn-primary" id="btn-add-room" style="margin-top:1rem;">Add Room</button>
            </div>
        </div>

        <!-- LIVE LOGS -->
        <div class="panel">
            <h2><i class="fa-solid fa-terminal"></i> Live Logs</h2>
            <div class="log-box" id="log"></div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="room-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Select Room(s)</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <input type="text" id="search-room" class="form-control" placeholder="Search rooms..." style="margin-bottom:1rem;">
            <div class="room-list" id="room-list"></div>
            <button class="btn-primary" onclick="closeModal()">Confirm Selection</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = '/'; }

        const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        let isAdmin = false;
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.role === 'admin') {
                isAdmin = true;
                document.getElementById('admin-tab').style.display = 'flex';
            }
        } catch (e) {}

        let ALL_ROOMS = [];
        let SELECTED_ROOMS = [];
        let MY_BOTS = [];

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                if (tab.dataset.tab === 'admin') refreshAdmin();
                if (tab.dataset.tab === 'my-bots') refreshBots();
            });
        });

        // ==== MY BOTS ====
        const refreshBots = async () => {
            try {
                const res = await fetch('/api/my-bots', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) return;
                const data = await res.json();
                MY_BOTS = data.bots;
                renderBots();
            } catch (e) {}
        };

        const renderBots = () => {
            const list = document.getElementById('bots-list');
            if (MY_BOTS.length === 0) {
                list.innerHTML = '<div style="color:var(--text-muted); text-align:center;">No bots yet. Add one above.</div>';
                return;
            }
            list.innerHTML = MY_BOTS.map(b => `
                <div class="bot-row">
                    <div class="bot-info">
                        <div class="bot-name"><span class="dot ${b.connected ? 'on' : 'off'}"></span> ${escapeHtml(b.username)}</div>
                        <div class="bot-status">Room: ${escapeHtml(b.room_name || '—')}</div>
                    </div>
                    <button class="btn-stop" onclick="removeBot('${escapeHtml(b.username)}')"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        };

        window.removeBot = async (username) => {
            if (!confirm(`Remove bot ${username}?`)) return;
            await fetch(`/api/my-bots/${username}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            refreshBots();
        };

        document.getElementById('btn-add-bot').addEventListener('click', async () => {
            const user = document.getElementById('new-bot-user').value.trim();
            const pass = document.getElementById('new-bot-pass').value;
            const msg = document.getElementById('bot-msg');
            if (!user || !pass) { msg.innerHTML = '<span style="color:var(--danger)">Fill both fields</span>'; return; }
            msg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Adding...';
            try {
                const res = await fetch('/api/my-bots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (res.ok) {
                    msg.innerHTML = `<span style="color:var(--success)">Bot '${escapeHtml(user)}' added!</span>`;
                    document.getElementById('new-bot-user').value = '';
                    document.getElementById('new-bot-pass').value = '';
                    refreshBots();
                } else {
                    msg.innerHTML = `<span style="color:var(--danger)">${escapeHtml(data.detail || 'Failed')}</span>`;
                }
            } catch (e) { msg.innerHTML = '<span style="color:var(--danger)">Network error</span>'; }
        });

        // ==== CHECKBOXES DE BOTS NA NEW TASK ====
        const renderBotCheckboxes = () => {
            const container = document.getElementById('bot-checkboxes');
            if (MY_BOTS.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted);">Add bots first in the "My Bots" tab.</div>';
                return;
            }
            container.innerHTML = `
                <div class="checkbox-item" style="border:1px solid var(--primary);">
                    <input type="checkbox" id="select-all-bots" onchange="toggleAllBots(this)">
                    <label for="select-all-bots" style="cursor:pointer; font-weight:600;">Select All</label>
                </div>
            ` + MY_BOTS.map(b => `
                <div class="checkbox-item">
                    <input type="checkbox" class="bot-checkbox" value="${escapeHtml(b.username)}" ${b.connected ? '' : 'disabled'}>
                    <label style="cursor:pointer;">${escapeHtml(b.username)} ${b.connected ? '' : '(offline)'}</label>
                </div>
            `).join('');
        };

        window.toggleAllBots = (el) => {
            document.querySelectorAll('.bot-checkbox').forEach(cb => {
                if (!cb.disabled) cb.checked = el.checked;
            });
        };

        // ==== ROOMS ====
        const openModal = () => {
            document.getElementById('room-modal').classList.add('active');
            document.getElementById('search-room').value = '';
            renderModalRooms('');
        };
        const closeModal = () => {
            document.getElementById('room-modal').classList.remove('active');
            renderChips();
        };
        const renderModalRooms = (filter) => {
            const list = document.getElementById('room-list');
            const filtered = ALL_ROOMS.filter(r => r.name.toLowerCase().includes(filter.toLowerCase()));
            list.innerHTML = filtered.map(r => {
                const isSelected = SELECTED_ROOMS.some(s => s.id === r.id);
                return `<div class="room-item ${isSelected ? 'selected' : ''}" data-id="${r.id}" data-name="${escapeHtml(r.name)}"><span>${escapeHtml(r.name)}</span></div>`;
            }).join('') || '<div style="color:var(--text-muted); text-align:center; padding:1rem;">No rooms</div>';
            list.querySelectorAll('.room-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id, name = el.dataset.name;
                    if (SELECTED_ROOMS.some(r => r.id === id)) SELECTED_ROOMS = SELECTED_ROOMS.filter(r => r.id !== id);
                    else SELECTED_ROOMS.push({ id, name });
                    renderModalRooms(filter);
                });
            });
        };
        const renderChips = () => {
            const c = document.getElementById('selected-chips');
            if (SELECTED_ROOMS.length === 0) {
                document.getElementById('selected-room-name').textContent = 'Select room(s)...';
                document.getElementById('selected-room-name').style.color = 'var(--text-muted)';
                c.innerHTML = '';
                return;
            }
            document.getElementById('selected-room-name').textContent = `${SELECTED_ROOMS.length} room(s) selected`;
            document.getElementById('selected-room-name').style.color = 'var(--text-main)';
            c.innerHTML = SELECTED_ROOMS.map(r => `<div class="chip">${escapeHtml(r.name)} <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="removeRoom('${r.id}')"></i></div>`).join('');
        };
        window.removeRoom = (id) => {
            SELECTED_ROOMS = SELECTED_ROOMS.filter(r => r.id !== id);
            renderChips();
            renderModalRooms(document.getElementById('search-room').value);
        };
        document.getElementById('room-trigger').addEventListener('click', openModal);
        document.getElementById('search-room').addEventListener('input', e => renderModalRooms(e.target.value));

        const loadData = async () => {
            try {
                const [a, g] = await Promise.all([fetch('/api/actions'), fetch('/api/gifts')]);
                ALL_ROOMS = (await a.json()).rooms;
                document.getElementById('gift-list').innerHTML = (await g.json()).gifts.map(x => `<option value="${escapeHtml(x.name)}">`).join('');
            } catch (e) {}
        };

        const updateForm = () => {
            const action = document.getElementById('action-select').value;
            document.getElementById('gift-fields').style.display = action === 'gift' ? 'block' : 'none';
            document.getElementById('park-fields').style.display = action === 'park' ? 'block' : 'none';
            document.getElementById('game-fields').style.display = ['royale','cricket','dice','lowcard'].includes(action) ? 'block' : 'none';
        };
        document.getElementById('action-select').addEventListener('change', updateForm);
        updateForm();

        // ==== CRIAR TAREFA ====
        document.getElementById('btn-create').addEventListener('click', async () => {
            const btn = document.getElementById('btn-create');
            const msg = document.getElementById('msg');
            const selectedBots = Array.from(document.querySelectorAll('.bot-checkbox:checked')).map(cb => cb.value);
            if (selectedBots.length === 0) { msg.innerHTML = '<span style="color:var(--danger)">Select at least one bot</span>'; return; }
            if (SELECTED_ROOMS.length === 0) { msg.innerHTML = '<span style="color:var(--danger)">Select at least one room</span>'; return; }

            const action = document.getElementById('action-select').value;
            const body = { action, room_ids: SELECTED_ROOMS.map(r => r.id), bot_usernames: selectedBots };

            if (action === 'gift') {
                body.gift_key = document.getElementById('gift-key').value;
                body.gift_count = parseInt(document.getElementById('gift-count').value);
                body.gift_interval = parseFloat(document.getElementById('gift-interval').value);
            } else if (action === 'park') {
                body.park_duration_min = parseInt(document.getElementById('park-duration').value);
            } else {
                body.bet_min = parseInt(document.getElementById('bet-min').value);
                body.bet_max = parseInt(document.getElementById('bet-max').value);
                body.bet_count = parseInt(document.getElementById('bet-count').value);
                body.play_duration_min = parseInt(document.getElementById('play-duration').value);
            }

            btn.disabled = true;
            msg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Launching on ' + selectedBots.length + ' bot(s)...';

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    msg.innerHTML = `<span style="color:var(--success)"><i class="fa-solid fa-check"></i> Task created on ${data.tasks.length} bot(s)!</span>`;
                    refresh();
                } else {
                    msg.innerHTML = `<span style="color:var(--danger)">${escapeHtml(data.detail || 'Failed')}</span>`;
                }
            } catch (e) { msg.innerHTML = '<span style="color:var(--danger)">Network error</span>'; }
            btn.disabled = false;
        });

        // ==== REFRESH GERAL ====
        const fmtTime = s => s < 60 ? s + 's' : s < 3600 ? Math.floor(s/60) + 'm' : Math.floor(s/3600) + 'h';
        const refresh = async () => {
            try {
                const res = await fetch('/api/status', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.status === 401) { localStorage.removeItem('token'); window.location.href = '/'; return; }
                if (!res.ok) return;
                const data = await res.json();
                const bots = data.bots || {};

                // Overview cards (um por bot)
                const grid = document.getElementById('bots-overview');
                grid.innerHTML = Object.entries(bots).map(([name, b]) => `
                    <div class="card">
                        <div class="label">${escapeHtml(name)}</div>
                        <div class="status-indicator">${b.connected ? '<span class="dot on"></span> Online' : '<span class="dot off"></span> Offline'}</div>
                        <div style="font-size:0.85rem; color:var(--text-muted);">Room: ${escapeHtml(b.room_name || '—')}</div>
                        <div style="font-size:0.85rem; color:var(--text-muted);">Balance: ${b.saldo ?? '—'}</div>
                    </div>
                `).join('') || '<div style="color:var(--text-muted)">No bots connected</div>';

                // Tasks
                let tasksHtml = '';
                for (const [name, b] of Object.entries(bots)) {
                    for (const t of (b.tasks || [])) {
                        let pr = t.action === 'gift' ? `${t.gifts_sent}/${t.gift_target}` : `${t.gifts_sent} acts`;
                        if (t.action === 'park') pr = t.park_ends_at ? fmtTime(Math.max(0, Math.floor(t.park_ends_at - Date.now()/1000))) + ' left' : '∞';
                        if (t.play_ends_at) pr = fmtTime(Math.max(0, Math.floor(t.play_ends_at - Date.now()/1000))) + ' left';
                        const badge = t.status === 'running' ? 'running' : t.status === 'stopped' ? 'stopped' : 'finished';
                        const btn = t.status === 'running' ? `<button class="btn-stop" onclick="stopTask('${escapeHtml(name)}','${t.id}')"><i class="fa-solid fa-stop"></i></button>` : '';
                        tasksHtml += `<tr>
                            <td><strong>${escapeHtml(name)}</strong></td>
                            <td>${escapeHtml(t.action.toUpperCase())}</td>
                            <td>${escapeHtml(t.room_name)}</td>
                            <td>${escapeHtml(pr)}</td>
                            <td><span class="badge ${badge}">${t.status}</span></td>
                            <td>${btn}</td>
                        </tr>`;
                    }
                }
                document.getElementById('tasks-body').innerHTML = tasksHtml || '<tr><td colspan="6" style="text-align:center; color:var(--text-muted)">No tasks</td></tr>';

                // Logs (do bot principal apenas, para não sobrecarregar)
                const firstBot = Object.values(bots)[0];
                const logEl = document.getElementById('log');
                if (firstBot && firstBot.logs) {
                    const wasBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
                    logEl.innerHTML = firstBot.logs.map(l => {
                        const text = typeof l.texto === 'object' ? JSON.stringify(l.texto) : String(l.texto);
                        return `<div class="log-line ${l.nivel}"><span class="time">${l.ts}</span>${escapeHtml(text)}</div>`;
                    }).join('');
                    if (wasBottom) logEl.scrollTop = logEl.scrollHeight;
                }
            } catch (e) {}
        };

        window.stopTask = async (botName, taskId) => {
            await fetch(`/api/tasks/${botName}/${taskId}/stop`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            refresh();
        };

        const refreshAdmin = async () => {
            if (!isAdmin) return;
            try {
                const [sess, rooms] = await Promise.all([
                    fetch('/api/admin/sessions', {headers: {'Authorization': `Bearer ${token}`}}).then(r => r.json()),
                    fetch('/api/admin/rooms', {headers: {'Authorization': `Bearer ${token}`}}).then(r => r.json())
                ]);
                let html = '';
                for (const [name, info] of Object.entries(sess.active_bots || {})) {
                    html += `<tr><td>${escapeHtml(name)}</td><td>${escapeHtml(info.room_name || '—')}</td><td>${info.tasks.length} tasks</td><td><span class="badge running">Online</span></td></tr>`;
                }
                document.getElementById('admin-bots-body').innerHTML = html || '<tr><td colspan="4" style="text-align:center">None</td></tr>';
                document.getElementById('admin-rooms-body').innerHTML = rooms.rooms.map(r => `
                    <tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.id)}</td><td>${escapeHtml(r.actions.join(', '))}</td>
                    <td><button class="btn-stop" onclick="removeAdminRoom('${r.id}')"><i class="fa-solid fa-trash"></i></button></td></tr>
                `).join('');
            } catch (e) {}
        };

        window.removeAdminRoom = async (id) => {
            if (!confirm('Remove room?')) return;
            await fetch(`/api/admin/rooms/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            refreshAdmin(); loadData();
        };

        document.getElementById('btn-add-room').addEventListener('click', async () => {
            const id = document.getElementById('new-room-id').value;
            const name = document.getElementById('new-room-name').value;
            const acts = document.getElementById('new-room-actions').value.split(',').map(s => s.trim());
            if (!id || !name) return;
            await fetch('/api/admin/rooms', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                body: JSON.stringify({id, name, actions: acts})
            });
            refreshAdmin(); loadData();
        });

        document.getElementById('logout').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/';
        });

        // ==== INIT ====
        loadData();
        refreshBots().then(renderBotCheckboxes);
        refresh();
        setInterval(refresh, 3000);
        if (isAdmin) setInterval(refreshAdmin, 5000);
    </script>
</body>
</html>
